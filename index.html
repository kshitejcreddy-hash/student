<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Login</title>
  </head>
  <body>
    <h2>Student Login</h2>

    <form id="loginForm">
      <label for="studentId">Student ID:</label><br />
      <input type="text" id="studentId" name="studentId" placeholder="Enter your student ID" required /><br /><br />

      <label for="password">Password:</label><br />
      <input type="password" id="password" name="password" placeholder="Enter your password" required /><br /><br />

      <button type="submit">Login</button>
    </form>

    <p id="message"></p>

    <script>
      const form = document.getElementById('loginForm');
      const message = document.getElementById('message');

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        const studentId = document.getElementById('studentId').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!studentId || !password) {
          message.textContent = 'Please enter both student ID and password.';
          return;
        }

        if (studentId === 'student123' && password === 'school123') {
          message.textContent = 'Login successful! Welcome back, student.';
          form.reset();
        } else {
          message.textContent = 'Invalid student ID or password.';
        }
      });
    </script>
  </body>
</html>
